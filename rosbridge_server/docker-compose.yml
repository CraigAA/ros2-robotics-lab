services:
  rosbridge:
    build: .
    container_name: rosbridge
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///config/cyclone.xml
    volumes:
      - ../monitor/cyclone.xml:/config/cyclone.xml:ro
    restart: unless-stopped
